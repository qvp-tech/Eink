; ESP32-C3 UART Bridge - Phuc vu cuu the e-ink bi brick
; Noi GPIO21 (TX) → VRX, GPIO20 (RX) ← VTX, GND → GND

[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.mcu = esp32c3
upload_port = COM8

; USB CDC On Boot - BAT BUOC de Serial (USB) khong trung GPIO20/21 voi Serial1
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
